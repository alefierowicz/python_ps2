[project]
name = "ps-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "marcel-alefierowicz", email = "mrclalefierowicz@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
ps-2 = "ps_2:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
