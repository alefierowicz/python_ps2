[project]
name = "ps-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "marcel-alefierowicz", email = "mrclalefierowicz@gmail.com" },
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
todo = "cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["cli", "project", "serializable", "task", "task_types", "zad2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
